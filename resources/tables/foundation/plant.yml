name: plant
schema: foundation

comment: Standardized plant and location master data prepared from raw source records.

columns:
  - name: plant_id
    type: STRING
    nullable: false
    comment: Standardized unique plant or location identifier.

  - name: plant_name
    type: STRING
    nullable: true
    comment: Standardized plant or location name.

  - name: plant_type
    type: STRING
    nullable: true
    comment: Standardized plant or facility type.

  - name: city
    type: STRING
    nullable: true
    comment: Standardized city associated with the plant.

  - name: state
    type: STRING
    nullable: true
    comment: Standardized state or administrative region associated with the plant.

  - name: country
    type: STRING
    nullable: true
    comment: Standardized country associated with the plant.

  - name: source_system
    type: STRING
    nullable: false
    comment: Source system from which the plant record originated.

  - name: source_record_id
    type: STRING
    nullable: true
    comment: Source-level identifier retained for traceability where applicable.

  - name: record_created_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the standardized record was created in the foundation layer.

  - name: record_updated_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the standardized record was last updated in the foundation layer.
