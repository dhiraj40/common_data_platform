name: material
schema: foundation

comment: Standardized material master data prepared from raw source records.

columns:
  - name: material_id
    type: STRING
    nullable: false
    comment: Standardized unique material identifier.

  - name: material_name
    type: STRING
    nullable: true
    comment: Standardized material name or description.

  - name: material_type
    type: STRING
    nullable: true
    comment: Standardized material type or category.

  - name: unit_of_measure
    type: STRING
    nullable: true
    comment: Standardized base unit of measure for the material.

  - name: product_group
    type: STRING
    nullable: true
    comment: Standardized product or material group.

  - name: source_system
    type: STRING
    nullable: false
    comment: Source system from which the material record originated.

  - name: source_record_id
    type: STRING
    nullable: true
    comment: Source-level identifier retained for traceability where applicable.

  - name: record_created_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the standardized record was created in the foundation layer.

  - name: record_updated_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the standardized record was last updated in the foundation layer.
