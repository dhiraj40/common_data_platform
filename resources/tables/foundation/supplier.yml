    nullable: false
    comment: Standardized unique supplier identifier.

  - name: supplier_name
    type: STRING
    nullable: true
    comment: Standardized supplier name.

  - name: supplier_type
    type: STRING
    nullable: true
    comment: Standardized supplier type or classification.

  - name: city
    type: STRING
    nullable: true
    comment: Standardized city associated with the supplier.

  - name: state
    type: STRING
    nullable: true
    comment: Standardized state or administrative region associated with the supplier.

  - name: country
    type: STRING
    nullable: true
