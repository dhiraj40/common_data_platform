name: plant
schema: raw

comment: Raw plant and location master data received from source systems.

columns:
  - name: plant_id
    type: STRING
    nullable: true
    comment: Plant or location identifier exactly as received from the source.

  - name: plant_name
    type: STRING
    nullable: true
    comment: Plant or location name exactly as received from the source.

  - name: plant_type
    type: STRING
    nullable: true
    comment: Plant or facility type exactly as received from the source.

  - name: city
    type: STRING
    nullable: true
    comment: City exactly as received from the source.

  - name: state
    type: STRING
    nullable: true
    comment: State or administrative region exactly as received from the source.

  - name: country
    type: STRING
    nullable: true
    comment: Country exactly as received from the source.

  - name: source_system
    type: STRING
    nullable: false
    comment: Source system from which the record was ingested.

  - name: source_file
    type: STRING
    nullable: true
    comment: Full source file path from which the record was ingested.

  - name: ingestion_batch_id
    type: STRING
    nullable: false
    comment: Unique identifier assigned to the ingestion run.

  - name: ingestion_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the record was ingested into the raw layer.
