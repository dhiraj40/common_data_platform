name: shipment
schema: raw

comment: Raw shipment and delivery data received from source systems.

columns:
  - name: shipment_id
    type: STRING
    nullable: true
    comment: Shipment identifier exactly as received from the source.

  - name: purchase_order_id
    type: STRING
    nullable: true
    comment: Purchase order identifier associated with the shipment.

  - name: purchase_order_line
    type: STRING
    nullable: true
    comment: Purchase order line associated with the shipment.

  - name: material_id
    type: STRING
    nullable: true
    comment: Material identifier associated with the shipment.

  - name: supplier_id
    type: STRING
    nullable: true
    comment: Supplier identifier associated with the shipment.

  - name: plant_id
    type: STRING
    nullable: true
    comment: Receiving plant or location identifier associated with the shipment.

  - name: shipment_date
    type: DATE
    nullable: true
    comment: Shipment dispatch date exactly as received from the source.

  - name: actual_delivery_date
    type: DATE
    nullable: true
    comment: Actual delivery date exactly as received from the source.

  - name: shipped_quantity
    type: DECIMAL(18,4)
    nullable: true
    comment: Quantity shipped exactly as received from the source.

  - name: received_quantity
    type: DECIMAL(18,4)
    nullable: true
    comment: Quantity received exactly as received from the source.

  - name: shipment_status
    type: STRING
    nullable: true
    comment: Shipment status exactly as received from the source.

  - name: carrier_name
    type: STRING
    nullable: true
    comment: Logistics carrier name exactly as received from the source.

  - name: transport_mode
    type: STRING
    nullable: true
    comment: Transportation mode exactly as received from the source.

  - name: source_system
    type: STRING
    nullable: false
    comment: Source system from which the record was ingested.

  - name: source_file
    type: STRING
    nullable: true
    comment: Full source file path from which the record was ingested.

  - name: ingestion_batch_id
    type: STRING
    nullable: false
    comment: Unique identifier assigned to the ingestion run.

  - name: ingestion_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the record was ingested into the raw layer.
