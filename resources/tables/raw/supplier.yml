name: supplier
schema: raw

comment: Raw supplier master data received from source systems.

columns:
  - name: supplier_id
    type: STRING
    nullable: true
    comment: Supplier identifier exactly as received from the source.

  - name: supplier_name
    type: STRING
    nullable: true
    comment: Supplier name exactly as received from the source.

  - name: supplier_type
    type: STRING
    nullable: true
    comment: Supplier type or classification exactly as received from the source.

  - name: city
    type: STRING
    nullable: true
    comment: City exactly as received from the source.

  - name: state
    type: STRING
    nullable: true
    comment: State or administrative region exactly as received from the source.

  - name: country
    type: STRING
    nullable: true
    comment: Country exactly as received from the source.

  - name: source_system
    type: STRING
    nullable: false
    comment: Source system from which the record was ingested.

  - name: source_file
    type: STRING
    nullable: true
    comment: Full source file path from which the record was ingested.

  - name: ingestion_batch_id
    type: STRING
    nullable: false
    comment: Unique identifier assigned to the ingestion run.

  - name: ingestion_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the record was ingested into the raw layer.
