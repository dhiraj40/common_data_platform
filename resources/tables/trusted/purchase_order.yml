name: purchase_order
schema: trusted

comment: Certified purchase order facts validated and conformed for reuse by downstream products.

columns:
  - name: purchase_order_id
    type: STRING
    nullable: false
    comment: Conformed purchase order identifier.

  - name: purchase_order_line
    type: STRING
    nullable: false
    comment: Conformed purchase order line identifier.

  - name: material_id
    type: STRING
    nullable: false
    comment: Validated material identifier referenced by the purchase order line.

  - name: supplier_id
    type: STRING
    nullable: false
    comment: Validated supplier identifier referenced by the purchase order.

  - name: plant_id
    type: STRING
    nullable: false
    comment: Validated receiving plant or location identifier.

  - name: order_date
    type: DATE
    nullable: true
    comment: Certified purchase order creation date.

  - name: requested_delivery_date
    type: DATE
    nullable: true
    comment: Certified requested delivery date.

  - name: order_quantity
    type: DECIMAL(18,4)
    nullable: true
    comment: Certified ordered quantity for the purchase order line.

  - name: unit_of_measure
    type: STRING
    nullable: true
    comment: Conformed unit of measure for the ordered quantity.

  - name: order_status
    type: STRING
    nullable: true
    comment: Conformed purchase order status.

  - name: source_system
    type: STRING
    nullable: false
    comment: Authoritative source system associated with the purchase order record.

  - name: record_created_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the trusted record was first created.

  - name: record_updated_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the trusted record was last updated.
