name: plant
schema: trusted

comment: Certified and conformed plant and location master data available for downstream products.

columns:
  - name: plant_id
    type: STRING
    nullable: false
    comment: Conformed unique identifier of the plant or location.

  - name: plant_name
    type: STRING
    nullable: true
    comment: Certified plant or location name.

  - name: plant_type
    type: STRING
    nullable: true
    comment: Conformed plant or facility type.

  - name: city
    type: STRING
    nullable: true
    comment: Conformed city associated with the plant.

  - name: state
    type: STRING
    nullable: true
    comment: Conformed state or administrative region associated with the plant.

  - name: country
    type: STRING
    nullable: true
    comment: Conformed country associated with the plant.

  - name: source_system
    type: STRING
    nullable: false
    comment: Authoritative source system associated with the plant record.

  - name: record_created_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the trusted record was first created.

  - name: record_updated_timestamp
    type: TIMESTAMP
    nullable: false
    comment: Timestamp when the trusted record was last updated.
