resources:
  jobs:
    raw_4x_daily:
      name: common-data-platform-${bundle.target}-raw-4x-daily

      parameters:
        - name: environment
          default: ${bundle.target}
        - name: datasets
          default: purchase_order,inventory
        - name: continuous
          default: "false"

      schedule:
        quartz_cron_expression: ${var.raw_4x_daily_cron}
        timezone_id: ${var.job_timezone}
        pause_status: ${var.workflow_pause_status}

      tasks:
        - task_key: raw_4x_daily_ingestion
          notebook_task:
            notebook_path: ../../notebooks/ingestion/01_raw_ingestion.ipynb
